name: Build Flappy Android APK

on:
  push:
    branches:
      - flappy-apk
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.1.2

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore Godot project
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils python3 unzip openjdk-17-jdk-headless
          cat project.b64.01 project.b64.02 project.b64.03 project.b64.04 project.b64.05 project.b64.06 project.b64.07 project.b64.08 > project.tar.xz.b64
          base64 -d project.tar.xz.b64 > project.tar.xz
          echo "1c9efbafa034682680c34992a3dc38d108aba28b2115d3e7999a551be279e1af  project.tar.xz" | sha256sum -c -
          mkdir -p project
          tar -xJf project.tar.xz -C project
          test -f project/project.godot
          grep -F 'run/main_scene="res://start.tscn"' project/project.godot
          grep -F 'config/features=PackedStringArray("4.1", "Mobile")' project/project.godot
          sed -i 's/package\/show_as_launcher_app=false/package\/show_as_launcher_app=true/' project/export_presets.cfg
          sed -i 's/gradle_build\/use_gradle_build=false/gradle_build\/use_gradle_build=true/' project/export_presets.cfg
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' project/project.godot

      - name: Generate Android PNG icons
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          def write_png(path, width, height, rgb):
              r, g, b = rgb
              raw = b''.join(b'\x00' + bytes([r, g, b]) * width for _ in range(height))
              def chunk(kind, data):
                  return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              Path(path).write_bytes(png)
          write_png('project/icon-main.png', 192, 192, (84, 188, 216))
          write_png('project/icon-adaptive-foreground.png', 432, 432, (255, 255, 255))
          write_png('project/icon-adaptive-background.png', 432, 432, (84, 188, 216))
          PY
          test -s project/icon-main.png
          test -s project/icon-adaptive-foreground.png
          test -s project/icon-adaptive-background.png
          sed -i 's#launcher_icons/main_192x192=""#launcher_icons/main_192x192="res://icon-main.png"#' project/export_presets.cfg
          sed -i 's#launcher_icons/adaptive_foreground_432x432=""#launcher_icons/adaptive_foreground_432x432="res://icon-adaptive-foreground.png"#' project/export_presets.cfg
          sed -i 's#launcher_icons/adaptive_background_432x432=""#launcher_icons/adaptive_background_432x432="res://icon-adaptive-background.png"#' project/export_presets.cfg
          sed -i 's#config/icon="res://icon.svg"#config/icon="res://icon-main.png"#' project/project.godot || true

      - name: Setup Godot Android environment and Gradle wrapper
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          mkdir -p ~/.local/share/godot/export_templates
          cp -a /root/.local/share/godot/export_templates/4.1.2.stable ~/.local/share/godot/export_templates/
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          mkdir -p project/android/build project/android/plugins
          touch project/android/build/.gdignore
          printf '4.1.2.stable\n' > project/android/.build_version
          unzip -q ~/.local/share/godot/export_templates/4.1.2.stable/android_source.zip -d project/android/build
          mv project/android/build/gradlew project/android/build/gradlew-real
          cat > project/android/build/gradlew <<'EOF'
          #!/bin/sh
          ROOT="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          MANIFEST="$ROOT/src/debug/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's#android:excludeFromRecents="false" android:screenOrientation=#android:exported="true" android:excludeFromRecents="false" android:screenOrientation=#' "$MANIFEST"
          fi
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dfile.encoding=UTF-8"
          "$ROOT/gradlew-real" "$@" --info --stacktrace --console=plain > "$ROOT/gradle-output.log" 2>&1
          exit $?
          EOF
          chmod +x project/android/build/gradlew project/android/build/gradlew-real
          printf 'sdk.dir=/usr/lib/android-sdk\n' > project/android/build/local.properties
          java -version
          test -d /usr/lib/android-sdk/platforms/android-33
          test -d /usr/lib/android-sdk/build-tools/33.0.2

      - name: Import project resources
        shell: bash
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          godot --headless --path project --editor --quit

      - name: Build debug APK
        shell: bash
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" project/build/flappy-debug.apk || true
          if [ ! -s project/build/flappy-debug.apk ]; then
            echo "Gradle build log follows:"
            cat project/android/build/gradle-output.log || true
            exit 1
          fi
          ls -lh project/build/flappy-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-debug-apk
          path: project/build/flappy-debug.apk
          if-no-files-found: error
          retention-days: 30
