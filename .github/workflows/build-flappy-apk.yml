name: Build Flappy Android APK

on:
  push:
    branches:
      - flappy-apk
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.1.2

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore Godot project
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils python3
          cat project.b64.01 project.b64.02 project.b64.03 project.b64.04 project.b64.05 project.b64.06 project.b64.07 project.b64.08 > project.tar.xz.b64
          base64 -d project.tar.xz.b64 > project.tar.xz
          echo "1c9efbafa034682680c34992a3dc38d108aba28b2115d3e7999a551be279e1af  project.tar.xz" | sha256sum -c -
          mkdir -p project
          tar -xJf project.tar.xz -C project
          test -f project/project.godot
          grep -F 'run/main_scene="res://start.tscn"' project/project.godot
          grep -F 'config/features=PackedStringArray("4.1", "Mobile")' project/project.godot
          sed -i 's/package\/show_as_launcher_app=false/package\/show_as_launcher_app=true/' project/export_presets.cfg
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' project/project.godot
          grep -F 'textures/vram_compression/import_etc2_astc=true' project/project.godot

      - name: Generate Android PNG icons
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def write_png(path, width, height, rgb):
              r, g, b = rgb
              raw = b''.join(b'\x00' + bytes([r, g, b]) * width for _ in range(height))
              def chunk(kind, data):
                  return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              Path(path).write_bytes(png)

          write_png('project/icon-main.png', 192, 192, (84, 188, 216))
          write_png('project/icon-adaptive-foreground.png', 432, 432, (255, 255, 255))
          write_png('project/icon-adaptive-background.png', 432, 432, (84, 188, 216))
          PY
          sed -i 's#launcher_icons/main_192x192=""#launcher_icons/main_192x192="res://icon-main.png"#' project/export_presets.cfg
          sed -i 's#launcher_icons/adaptive_foreground_432x432=""#launcher_icons/adaptive_foreground_432x432="res://icon-adaptive-foreground.png"#' project/export_presets.cfg
          sed -i 's#launcher_icons/adaptive_background_432x432=""#launcher_icons/adaptive_background_432x432="res://icon-adaptive-background.png"#' project/export_presets.cfg
          sed -i 's#config/icon="res://icon.svg"#config/icon="res://icon-main.png"#' project/project.godot || true
          file project/icon-main.png project/icon-adaptive-foreground.png project/icon-adaptive-background.png
          grep -F 'launcher_icons/main_192x192="res://icon-main.png"' project/export_presets.cfg

      - name: Setup Godot 4.1 Android environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -a /root/.local/share/godot/export_templates/4.1.2.stable ~/.local/share/godot/export_templates/
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/
          fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          godot --version
          java -version
          test -f /root/debug.keystore
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey

      - name: Import project resources
        shell: bash
        run: godot --headless --path project --editor --quit

      - name: Build debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" project/build/flappy-debug.apk
          test -s project/build/flappy-debug.apk
          ls -lh project/build/flappy-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-debug-apk
          path: project/build/flappy-debug.apk
          if-no-files-found: error
          retention-days: 30
