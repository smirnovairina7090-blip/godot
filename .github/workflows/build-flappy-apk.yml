name: Build Flappy Android APK

on:
  push:
    branches:
      - flappy-apk
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore Godot project
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils
          cat project.b64.01 project.b64.02 project.b64.03 project.b64.04 project.b64.05 project.b64.06 project.b64.07 project.b64.08 > project.tar.xz.b64
          base64 -d project.tar.xz.b64 > project.tar.xz
          echo "1c9efbafa034682680c34992a3dc38d108aba28b2115d3e7999a551be279e1af  project.tar.xz" | sha256sum -c -
          mkdir -p project
          tar -xJf project.tar.xz -C project
          test -f project/project.godot
          grep -F 'run/main_scene="res://start.tscn"' project/project.godot

      - name: Setup Godot Android environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          sed -i 's|gradle_build/target_sdk=""|gradle_build/target_sdk="34"|' project/export_presets.cfg
          cat >> project/export_presets.cfg <<'EOF'
          keystore/debug="/root/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          one_click_deploy/clear_previous_install=false
          EOF
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey
          ls -la /usr/lib/android-sdk/build-tools/34.0.0
          godot --version

      - name: Import project resources
        shell: bash
        run: godot --headless --path project --editor --quit

      - name: Build debug APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" project/build/flappy-debug.apk
          test -s project/build/flappy-debug.apk
          ls -lh project/build/flappy-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-debug-apk
          path: project/build/flappy-debug.apk
          if-no-files-found: error
          retention-days: 30
